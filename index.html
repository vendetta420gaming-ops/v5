<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vendetta MVP</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background:#070a08;
      color:#fff;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box {
      background:#111;
      padding:30px;
      border-radius:12px;
      width:320px;
      text-align:center;
    }
    input, button {
      width:100%;
      margin:6px 0;
      padding:10px;
      border-radius:8px;
      border:none;
    }
    button {
      background:#8cff86;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Vendetta Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">LOGIN</button>
  <button onclick="signup()">SIGN UP</button>

  <hr>

  <button onclick="startGenerator()">START GENERATOR</button>
  <button onclick="claim()">CLAIM REWARD</button>

  <p id="status">Not logged in</p>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://vilmlywdxjgiyprbycxd.supabase.co",
  "sb_publishable_n7Ex1jNG-G52gmhdCuT1WQ_pup19bxo"
)

let user = null
let sessionId = null
let progress = 0

// CHECK SESSION
async function checkUser() {
  const { data } = await supabase.auth.getUser()
  user = data.user

  if (user) {
    document.getElementById("status").innerText = "Logged in: " + user.email
  }
}

checkUser()

// LOGIN
async function login() {
  const email = document.getElementById("email").value
  const password = document.getElementById("password").value

  const { data, error } = await supabase.auth.signInWithPassword({
    email, password
  })

  if (error) alert(error.message)
  else {
    user = data.user
    document.getElementById("status").innerText = "Logged in!"
  }
}

// SIGNUP
async function signup() {
  const email = document.getElementById("email").value
  const password = document.getElementById("password").value

  const { error } = await supabase.auth.signUp({
    email, password
  })

  if (error) alert(error.message)
  else alert("Check email for confirmation")
}

// START GENERATOR
async function startGenerator() {

  if (!user) {
    alert("Login first")
    return
  }

  const { data, error } = await supabase
    .from("sessions")
    .insert([
      {
        user_id: user.id,
        status: "active",
        progress: 0
      }
    ])
    .select()

  if (error) {
    alert(error.message)
    return
  }

  sessionId = data[0].id
  progress = 0

  document.getElementById("status").innerText = "Generator running..."

  // DRIP SIMULATION
  const interval = setInterval(async () => {
    progress += 10

    await supabase
      .from("sessions")
      .update({ progress })
      .eq("id", sessionId)

    if (progress >= 100) {
      clearInterval(interval)
      document.getElementById("status").innerText = "Ready to claim"
    }

  }, 1000)
}

// CLAIM
async function claim() {

  if (!sessionId) return

  const reward = 0.12

  await supabase
    .from("sessions")
    .update({
      status: "completed",
      reward
    })
    .eq("id", sessionId)

  document.getElementById("status").innerText = "Reward claimed: " + reward + " V"

}

</script>

</body>
</html>
