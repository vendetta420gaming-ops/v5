<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendetta</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial;
  overflow:hidden;
  background:black;
}

/* VIDEO */
video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
}

/* FALLBACK AKO VIDEO NE RADI */
body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  z-index:-2;
}

/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
}

/* CENTER */
.container{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.title{
  color:white;
  font-size:32px;
  margin-bottom:20px;
  letter-spacing:4px;
}

.btn{
  display:block;
  width:220px;
  margin:10px auto;
  padding:12px;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:10px;
  background:rgba(0,0,0,0.3);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="./publicassetsbg.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
  <div class="title">VENDETTA</div>

  <button class="btn" onclick="goHome()">LOGIN</button>
  <button class="btn" onclick="goHome()">CREATE ACCOUNT</button>
</div>

<script>
function goHome(){
  window.location.href="home.html";
}
</script>

</body>
</html>
