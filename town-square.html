<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendetta — Town Square</title>
  <link rel="stylesheet" href="assets/vendetta-sync.css"/>
  <style>
    :root{
      --accent:#8cff86;
      --accent-glow:rgba(140,255,134,.38);
      --line:rgba(255,255,255,.08);
      --header-bg:rgba(5,7,5,.56);
      --ease:320ms cubic-bezier(.23,1,.32,1);
    }
    body.theme-nuclear{--accent:#8cff86;--accent-glow:rgba(140,255,134,.38)}
    body.theme-solar{--accent:#f0c974;--accent-glow:rgba(240,201,116,.34)}
    body.theme-inferno{--accent:#ff7a5d;--accent-glow:rgba(255,122,93,.34)}
    body.theme-void{--accent:#9680ff;--accent-glow:rgba(150,128,255,.34)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#040504;
      color:#edf3ed;
      overflow-x:hidden;
      line-height:1.5;
    }
    .global-video-bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:#030403}
    .global-video-media{width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.04) brightness(.24);transform:scale(1.04)}
    .global-video-scrim{position:absolute;inset:0;background:
      radial-gradient(circle at 50% 10%, rgba(255,255,255,.06), transparent 24%),
      linear-gradient(180deg, rgba(4,5,4,.28) 0%, rgba(4,5,4,.48) 28%, rgba(3,4,3,.78) 68%, rgba(3,4,3,.94) 100%)}

    header{position:sticky;top:0;z-index:100;background:var(--header-bg)!important;border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);box-shadow:0 18px 44px rgba(0,0,0,.22)}
    .header-inner{display:flex!important;align-items:center;justify-content:space-between;gap:clamp(24px,3vw,56px)!important;min-height:96px!important;padding:18px 40px!important}
    .brand{flex:0 0 auto;margin-right:clamp(8px,1.8vw,28px)}
    .brand-link,.brand-link img{display:block}
    .brand-link img{width:112px;height:auto;filter:drop-shadow(0 0 24px rgba(255,255,255,.12)) drop-shadow(0 0 24px var(--accent-glow))}
    nav{display:flex;flex:1 1 auto;justify-content:center!important;align-items:center;gap:clamp(18px,2vw,42px)!important;padding:0 clamp(10px,2vw,36px);flex-wrap:nowrap!important}
    nav a{color:#ccd4cc;text-decoration:none;text-transform:uppercase;position:relative;font-size:10.8px;letter-spacing:.24em;font-weight:500;padding:18px 0!important;white-space:nowrap;transition:color var(--ease)}
    nav a:hover,nav a.active{color:var(--accent)}
    nav a.active::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent-glow)}
    .top-right{display:flex;align-items:center;gap:16px!important;flex:0 0 auto;margin-left:clamp(8px,1.5vw,24px)!important;position:relative}
    .wallet-box{min-height:46px;padding:0 20px;display:inline-flex;align-items:center;gap:8px;border-radius:9999px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(14,17,14,.84),rgba(9,11,9,.9));backdrop-filter:blur(14px);box-shadow:0 0 26px rgba(196,170,99,.18),inset 0 1px 0 rgba(255,255,255,.05),0 0 30px rgba(240,212,138,.08);white-space:nowrap}
    .wallet-mark,.wallet-value{background:linear-gradient(90deg,#c4aa63 0%,#f0d48a 28%,#eef3ff 52%,#d6dee8 72%,#c4aa63 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
    .wallet-value{font-size:31px;letter-spacing:-.04em}.wallet-mark{font-size:18px}
    .icon{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);display:grid;place-items:center;color:#e7ece7;font-size:13px;cursor:pointer}

    .page-shell{max-width:1560px;margin:0 auto;padding:24px 24px 80px}
    .hero-wrap{position:relative;border:1px solid var(--line);border-radius:34px;overflow:hidden;min-height:calc(100vh - 148px);background:#020302;box-shadow:0 32px 80px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.04)}
    .hero-video{display:block;width:100%;height:calc(100vh - 148px);min-height:640px;object-fit:cover;background:#000}

    .sections-wrap{margin-top:18px}
    .orb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .orb-card{position:relative;padding:22px;border-radius:28px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));box-shadow:0 20px 48px rgba(0,0,0,.22);overflow:hidden;cursor:pointer;transition:transform var(--ease), border-color var(--ease), box-shadow var(--ease);text-align:left}
    .orb-card:hover,.orb-card.is-active{transform:translateY(-4px);border-color:rgba(255,255,255,.14);box-shadow:0 26px 60px rgba(0,0,0,.28), 0 0 32px var(--accent-glow)}
    .orb-card::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--card-accent) 52%, white 8%), transparent 66%);opacity:.7;filter:blur(10px)}
    .orb-card::after{content:"";position:absolute;left:22px;right:22px;bottom:20px;height:2px;border-radius:999px;background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--card-accent) 74%, white 10%), transparent);box-shadow:0 0 20px color-mix(in srgb, var(--card-accent) 38%, transparent)}
    .orb-card small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.56);margin-bottom:12px}
    .orb-card strong{display:block;font-size:34px;letter-spacing:-.05em;line-height:.94;margin-bottom:10px}
    .orb-card p{color:rgba(232,240,232,.72);font-size:14px;max-width:36ch;padding-right:42px}
    .orb-card .orb-glow{margin-top:18px;width:78px;height:78px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:radial-gradient(circle, color-mix(in srgb, var(--card-accent) 40%, white 12%), rgba(255,255,255,.03) 38%, rgba(255,255,255,0) 72%);box-shadow:0 0 22px color-mix(in srgb, var(--card-accent) 34%, transparent), inset 0 0 20px rgba(255,255,255,.06)}
    .orb-card.discord{--card-accent:#7289da}.orb-card.forum{--card-accent:#57c7ff}.orb-card.clips{--card-accent:#ff8b6a}.orb-card.streamers{--card-accent:#7cf0b8}.orb-card.slot5{--card-accent:#d699ff}.orb-card.slot6{--card-accent:#f0c974}

    footer{max-width:1560px;margin:0 auto;padding:0 24px 48px;color:rgba(255,255,255,.5);font-size:13px}

    @media (max-width:1100px){
      .header-inner{flex-wrap:wrap;justify-content:center}
      nav{order:3;width:100%;overflow-x:auto;justify-content:flex-start!important;padding-bottom:2px}
      .top-right{margin-left:0!important}
      .page-shell{padding:18px 14px 70px}
      .hero-wrap{min-height:auto}
      .hero-video{height:68vh;min-height:460px}
      .orb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:700px){
      .orb-grid{grid-template-columns:1fr}
      .orb-card strong{font-size:28px}
      .hero-video{height:54vh;min-height:320px}
    }
  

  /* === V-COIN balance refresh / liquid glass 2026 === */
  .top-right{align-items:center;gap:12px!important}
  .wallet-box,.wallet{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    min-height:46px;
    padding:0 14px 0 13px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.08)!important;
    background:linear-gradient(180deg, rgba(22,28,27,.34), rgba(10,13,12,.46))!important;
    box-shadow:0 10px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08), 0 0 22px color-mix(in srgb, var(--accent, var(--green, #8cff86)) 12%, transparent)!important;
    backdrop-filter:blur(18px) saturate(1.18);
    -webkit-backdrop-filter:blur(18px) saturate(1.18);
    overflow:hidden;
  }
  .wallet-box::before,.wallet::before{
    content:"";
    position:absolute;
    inset:1px;
    border-radius:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.025) 38%, rgba(255,255,255,.01));
    opacity:.6;
    pointer-events:none;
  }
  .wallet-box::after,.wallet::after{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    background:radial-gradient(circle at 18% 16%, rgba(255,255,255,.13), transparent 26%), radial-gradient(circle at 82% 130%, color-mix(in srgb, var(--accent, var(--green, #8cff86)) 15%, transparent), transparent 38%);
    opacity:.85;
    pointer-events:none;
  }
  .wallet-mark,.wallet .mark{
    position:relative;
    z-index:1;
    font-size:13px!important;
    font-weight:800;
    letter-spacing:.04em;
    color:rgba(245,248,245,.9)!important;
    background:none!important;
    -webkit-text-fill-color:initial!important;
    text-shadow:0 0 18px color-mix(in srgb, var(--accent, var(--green, #8cff86)) 20%, transparent);
  }
  .wallet-value,.wallet .value{
    position:relative;
    z-index:1;
    font-size:17px!important;
    font-weight:700;
    letter-spacing:-.03em;
    color:#edf3ee!important;
    background:none!important;
    -webkit-text-fill-color:initial!important;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 18px rgba(255,255,255,.06);
  }
  .wallet-box:hover,.wallet:hover{
    transform:translateY(-1px);
    border-color:rgba(255,255,255,.12)!important;
    box-shadow:0 14px 34px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.1), 0 0 28px color-mix(in srgb, var(--accent, var(--green, #8cff86)) 18%, transparent)!important;
  }
  .arena-wallet{
    background:linear-gradient(180deg, rgba(22,24,29,.34), rgba(10,12,16,.48))!important;
    opacity:.94;
  }
  @media (max-width:900px){
    .wallet-box,.wallet{min-height:42px;padding:0 12px;gap:8px}
    .wallet-value,.wallet .value{font-size:15px!important}
    .wallet-mark,.wallet .mark{font-size:12px!important}
  }

</style>
</head>
<body class="theme-nuclear">
  <div class="global-video-bg" aria-hidden="true">
    <video class="global-video-media" autoplay muted loop playsinline preload="auto">
      <source src="global-bg.mp4" type="video/mp4">
    </video>
    <div class="global-video-scrim"></div>
  </div>

  <header>
    <div class="header-inner">
      <div class="brand"><a class="brand-link" href="index.html" aria-label="Vendetta Home"><img src="vendetta_logo_header_large.png" alt="Vendetta"></a></div>
      <nav>
        <a href="battlepass.html">Battle Pass</a>
        <a href="shop.html">Shop</a>
        <a href="generator.html">Generator</a>
        <a href="arena.html">Arena</a>
        <a href="rewards.html">Rewards</a>
      </nav>
      <div class="top-right">
        <div class="wallet-box"><span class="wallet-mark">V</span><span class="wallet-value">8.4537</span></div>
        <div class="icon">HR</div>
        <div class="icon">✦</div>
        <div class="icon">⌾</div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero-wrap">
      <video class="hero-video" autoplay muted loop playsinline preload="auto">
        <source src="assets/town-square-showcase.mp4" type="video/mp4">
      </video>
    </section>

    <section class="sections-wrap">
      <div class="orb-grid" id="orbGrid">
        <button class="orb-card discord" type="button">
          <small>Node 01</small><strong>Discord</strong><p>Community gateway i live koordinacija.</p><div class="orb-glow"></div>
        </button>
        <button class="orb-card forum" type="button">
          <small>Node 02</small><strong>Forum</strong><p>Long-form rasprave i community znanje.</p><div class="orb-glow"></div>
        </button>
        <button class="orb-card clips" type="button">
          <small>Node 03</small><strong>Clips</strong><p>Short-form highlight lane i viral pulse.</p><div class="orb-glow"></div>
        </button>
        <button class="orb-card streamers" type="button">
          <small>Node 04</small><strong>Streamers</strong><p>Featured creatori i live showcase.</p><div class="orb-glow"></div>
        </button>
        <button class="orb-card slot5" type="button">
          <small>Node 05</small><strong>Slot 5</strong><p>Rezerviran modul za kasniju ekspanziju.</p><div class="orb-glow"></div>
        </button>
        <button class="orb-card slot6" type="button">
          <small>Node 06</small><strong>Slot 6</strong><p>Otvoren future node bez lomljenja UI-ja.</p><div class="orb-glow"></div>
        </button>
      </div>
    </section>
  </main>

  <footer>Vendetta demo bundle 4.2 • Town Square video showcase.</footer>

  <script src="assets/vendetta-sync.js"></script>
  <script>
    document.querySelectorAll('.orb-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.orb-card').forEach(el => el.classList.remove('is-active'));
        card.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
