<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* LOGO (HOME LINK) */
.logo{
  position:absolute;
  top:20px;
  left:20px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

/* CENTER */
.container{
  text-align:center;
}

h1{
  margin-bottom:20px;
}

/* BUTTON */
button{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  background:#6cff9a;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HOME LINK -->
<div class="logo" onclick="goHome()">VENDETTA</div>

<div class="container">
  <h1>GENERATOR</h1>
  <button onclick="fake()">GENERATE</button>
</div>

<script>
function goHome(){
  window.location.href="home.html";
}

function fake(){
  alert("Generating...");
}
</script>

</body>
</html>
