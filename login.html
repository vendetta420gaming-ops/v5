<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendetta Login</title>

<style>
body,html{
 margin:0;
 padding:0;
 height:100%;
 background:black;
 font-family:Arial;
 overflow:hidden;
}

/* VIDEO */
video{
 position:fixed;
 top:0;left:0;
 width:100%;
 height:100%;
 object-fit:cover;
 z-index:-2;
}

/* OVERLAY */
.overlay{
 position:fixed;
 width:100%;
 height:100%;
 background:rgba(0,0,0,0.65);
 z-index:-1;
}

/* CENTER */
.container{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 text-align:center;
 color:white;
}

/* TITLE */
h2{
 letter-spacing:2px;
 opacity:0.9;
}

/* COIN */
.coin{
 width:120px;
 height:120px;
 border-radius:50%;
 background:radial-gradient(circle,#0f0,#020);
 margin:30px auto;
 box-shadow:0 0 30px #0f0;
 animation:pulse 2s infinite;
}

@keyframes pulse{
 0%{transform:scale(1)}
 50%{transform:scale(1.1)}
 100%{transform:scale(1)}
}

/* BUTTON */
button{
 display:block;
 width:260px;
 margin:10px auto;
 padding:15px;
 border-radius:30px;
 border:1px solid rgba(255,255,255,0.2);
 background:#111;
 color:white;
 cursor:pointer;
 transition:0.3s;
}

button:hover{
 background:#0f0;
 color:black;
}

</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop>
 <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
 <h2>ENTER THE ECOSYSTEM</h2>

 <div class="coin"></div>

 <button id="google-login">Continue with Google</button>
 <button onclick="alert('Fingerprint dolazi u phase 3')">Fingerprint</button>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://vilmlywdxjgiyprbycxd.supabase.co";

// ⛔ OVO MORAŠ STAVITI
const SUPABASE_KEY = "PASTE_ANON_KEY_HERE";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// GOOGLE LOGIN
document.getElementById("google-login").onclick = async () => {
 await supabase.auth.signInWithOAuth({
   provider: "google",
   options: {
     redirectTo: window.location.origin + "/login.html"
   }
 });
};

// SESSION CHECK (kad se vrati s Google-a)
(async () => {
 const { data } = await supabase.auth.getSession();

 if (data.session) {
   console.log("USER:", data.session.user);

   // 🔥 OVDJE IDE REDIRECT NA GENERATOR
   // window.location.href = "index.html";
 }
})();
</script>

</body>
</html>
