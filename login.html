<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendetta Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* VIDEO BACKGROUND */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* DARK OVERLAY */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

/* CENTER CONTENT */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* TITLE */
.title {
  color: white;
  font-size: 32px;
  margin-bottom: 20px;
  letter-spacing: 4px;
}

/* BUTTONS */
.btn {
  display: block;
  width: 220px;
  margin: 10px auto;
  padding: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 10px;
  background: rgba(0,0,0,0.3);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop>
  <source src="publicassetsbg.mp4.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
  <div class="title">VENDETTA</div>

  <button class="btn" onclick="goToApp()">LOGIN</button>
  <button class="btn" onclick="goToApp()">CREATE ACCOUNT</button>
</div>

<script>
function goToApp() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
